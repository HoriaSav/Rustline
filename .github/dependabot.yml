# Dependabot version updates.
# Note: GitHub only reads this file from the default branch (main).
version: 2
updates:
  # Cargo dependencies of the Rust workspace
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Pinned to =0.48.0: newer versions need Rust > our MSRV 1.85.
      - dependency-name: gtfs-structures
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  # Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
