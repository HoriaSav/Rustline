# Dependabot version updates.
# Note: GitHub only reads this file from the default branch (main).
# Each ecosystem gets one grouped PR per week.
version: 2
updates:
  # Cargo dependencies of the Rust workspace
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Pinned to =0.48.0: newer versions need Rust > our MSRV 1.85.
      - dependency-name: gtfs-structures
        versions: [">=0.49"]
      # Moves only together with flutter_rust_bridge_codegen, the Dart
      # package and the regenerated bindings: upgraded by hand (plan M10).
      - dependency-name: flutter_rust_bridge
    groups:
      cargo:
        patterns: ["*"]

  # Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Pinned to a commit sha; the toolchain (1.85 MSRV, stable) is the
      # `toolchain:` input, so a Dependabot bump adds nothing. Updated by hand.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      github-actions:
        patterns: ["*"]
