# Dependabot version updates.
# Note: GitHub only reads this file from the default branch (main).
# Each ecosystem gets one grouped PR per week.
version: 2
updates:
  # Cargo dependencies of the Rust workspace
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Pinned to =0.48.0: newer versions need Rust > our MSRV 1.85.
      - dependency-name: gtfs-structures
        versions: [">=0.49"]
    groups:
      cargo:
        patterns: ["*"]

  # Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The toolchain tag is our Rust 1.85 MSRV pin; never bump it.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      github-actions:
        patterns: ["*"]
