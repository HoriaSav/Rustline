# Dependabot version updates.
# Note: GitHub only reads this file from the default branch (main).
# Each ecosystem gets one grouped PR per week.
version: 2
updates:
  # Cargo dependencies of the Rust workspace
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Upgraded by hand: the Rust crate, the Dart package and
      # flutter_rust_bridge_codegen move in lockstep, then bindings are
      # regenerated (plan M10 decision 7).
      - dependency-name: flutter_rust_bridge
    groups:
      cargo:
        patterns: ["*"]
        # Its 0.x bumps change the API: reviewed in a PR of its own.
        exclude-patterns: ["gtfs-structures"]

  # Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Pinned to a commit sha; the toolchain (MSRV, stable) is the
      # `toolchain:` input, so a Dependabot bump adds nothing. Updated by hand.
      - dependency-name: dtolnay/rust-toolchain
    groups:
      github-actions:
        patterns: ["*"]
