name: iOS

# Plan M11: integration tests on an iPhone 17 simulator, a device build without
# codesigning, the FFI tests on macOS and the app size vs a blank app. Public
# repo, so standard macOS minutes are free; path filters keep it to iOS-relevant
# changes. Not a required check (path-filtered workflows never report on
# unrelated PRs).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ios.yml"
      - "rustline_flutter/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "data/fixtures/tiny/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ios.yml"
      - "rustline_flutter/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "data/fixtures/tiny/**"

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  FLUTTER_VERSION: 3.47.8

jobs:
  simulator:
    name: integration_test on iPhone 17 simulator
    runs-on: macos-26
    # About 7 min of setup, the warm-up's 15, the test step's 10 and 5 for the
    # crash reports and the log upload: 37, so 90 leaves 53 of slack (kept at
    # 90 by Leader's R54 L1).
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # Test and simulator logs, uploaded at the end whatever happens.
      - name: Log directory
        run: |
          echo "LOGS=$RUNNER_TEMP/ios-sim-logs" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/ios-sim-logs"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      # cargokit builds the plugin in its own target dir under build/, so
      # only the registry is worth caching.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          key: ios-sim
          cache-targets: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build the tiny pack
        run: |
          cargo run --locked --release -p rustline-cli -- build-pack --gtfs data/fixtures/tiny \
            --out "$RUNNER_TEMP/pack" --feed-id tiny --built-at 1700000000
          pack=$(ls "$RUNNER_TEMP"/pack/*.rlp.zst)
          echo "PACK_ZST=$pack" >> "$GITHUB_ENV"
      - uses: futureware-tech/simulator-action@c768f52966d5f70335ec77881f9806b24a52f80e  # v6
        id: sim
        with:
          model: iPhone 17
          wait_for_boot: true
      # SwiftPM off for this job, before pub get writes the plugin list: then
      # integration_test comes in through CocoaPods like rustline_flutter, and
      # RunnerTests' `inherit! :search_paths` (Podfile) resolves
      # `@import integration_test` now that RunnerTests no longer links
      # FlutterGeneratedPluginSwiftPackage. Flutter leaves the pbxproj's package
      # reference alone and generates that package empty.
      - name: Pub get
        working-directory: rustline_flutter/example
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get --enforce-lockfile
      # Pod install and the full app build (Rust included) once, outside the
      # per-file cap; `xcodebuild test` in the loop reuses the products in the
      # default DerivedData. Same file as the loop.
      - name: Warm-up build
        working-directory: rustline_flutter/example
        timeout-minutes: 15
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -- integration_test/m11_ios_test.dart
          {
            flutter build ios --config-only --simulator "$1" \
              --dart-define=RUSTLINE_M11_PACK_ZST="$PACK_ZST" \
              --dart-define=RUSTLINE_M11_REQUIRE_PACK=true
            xcodebuild build-for-testing -workspace ios/Runner.xcworkspace -scheme Runner \
              -configuration Debug -destination "platform=iOS Simulator,id=$UDID" \
              CODE_SIGNING_ALLOWED=NO
          } 2>&1 | tee "$LOGS/warmup.log"
      # Only m11_ios_test.dart: the M6 files (rustline_smoke, lifecycle,
      # pack_safety, panic, perf) need a Brașov pack with streets that CI does
      # not have, and without it they only soft-pass (known gap, R54 H2).
      # One file at a time, each limited to 7 min, so a hang names its file:
      # 1 file x 7 min plus 3.
      # Runs through XCTest (integration_test's iOS runner, RunnerTests.m), not
      # `flutter test -d`: Flutter 3.47.8 can launch the app before its
      # simulator log reader is up, miss the VM Service URL and wait forever
      # (flutter/flutter#181771, fixed on master by flutter/flutter#193142).
      # A file that times out stops the run; a file that fails does not.
      - name: Integration tests
        working-directory: rustline_flutter/example
        timeout-minutes: 10
        shell: bash --noprofile --norc -eo pipefail {0}
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          # The log stream leads its own process group (macOS has no setsid):
          # perl execs it, so $! is both its pid and its group id.
          perl -e 'setpgrp(0, 0); exec(@ARGV) or die "exec: $!";' \
            xcrun simctl spawn "$UDID" log stream --level debug \
            --predicate 'process == "Runner"' > "$LOGS/simulator.log" 2>&1 &
          logpid=$!
          # Kill the log stream's whole group, never this shell's own group.
          stop_log() {
            if [ "$(ps -o pgid= -p "$logpid" | tr -d ' ')" = "$logpid" ] &&
              [ "$logpid" != "$(ps -o pgid= -p $$ | tr -d ' ')" ]; then
              kill -TERM -- "-$logpid" 2>/dev/null || true
            else
              kill -TERM "$logpid" 2>/dev/null || true
            fi
          }
          trap stop_log EXIT
          # macOS has no coreutils timeout: run "$@" in its own process group
          # and kill the group (flutter, xcrun, log readers) after $1 seconds.
          run_with_timeout() {
            perl -e '
              my $t = shift;
              my $pid = fork() // die "fork: $!";
              if ($pid == 0) { setpgrp(0, 0); exec(@ARGV) or die "exec: $!"; }
              $SIG{ALRM} = sub {
                kill("TERM", -$pid); sleep 10; kill("KILL", -$pid);
                print STDERR "timed out after ${t}s\n"; exit 124;
              };
              alarm $t;
              waitpid($pid, 0);
              exit(($? & 127) ? 128 + ($? & 127) : $? >> 8);
            ' "$@"
          }
          # One file: point the Xcode project at it (FLUTTER_TARGET and the
          # defines go into Generated.xcconfig; pod install), then build and
          # run it through XCTest. One XCTest case per Dart test; a failing
          # Dart test fails its case and xcodebuild.
          test_file() {
            flutter build ios --config-only --simulator integration_test/"$1".dart \
              --dart-define=RUSTLINE_M11_PACK_ZST="$PACK_ZST" \
              --dart-define=RUSTLINE_M11_REQUIRE_PACK=true &&
              xcodebuild test -workspace ios/Runner.xcworkspace -scheme Runner \
                -configuration Debug -destination "platform=iOS Simulator,id=$UDID" \
                -parallel-testing-enabled NO -resultBundlePath "$LOGS/$1.xcresult" \
                CODE_SIGNING_ALLOWED=NO
          }
          export -f test_file
          # XCTest only reports the Dart tests whose body ran, and a run with
          # none passes, so a file passes only if its result bundle exists and
          # counts passed tests and no failed or skipped ones. The summary is
          # kept as $LOGS/<name>.summary.json.
          check_summary() {
            local xr="$LOGS/$1.xcresult" js="$LOGS/$1.summary.json"
            if [ ! -d "$xr" ]; then
              echo "::error::$1: no result bundle ($xr)"
              return 1
            fi
            if ! xcrun xcresulttool get test-results summary --path "$xr" > "$js"; then
              echo "::error::$1: xcresulttool could not read $xr"
              return 1
            fi
            cat "$js"
            if ! python3 - "$js" <<'PY'
          import json, sys
          s = json.load(open(sys.argv[1]))
          p, f, k = (s.get(n) for n in ("passedTests", "failedTests", "skippedTests"))
          print(f"passed={p} failed={f} skipped={k}")
          sys.exit(0 if isinstance(p, int) and p > 0 and f == 0 and k == 0 else 1)
          PY
            then
              echo "::error::$1: needs passedTests > 0, failedTests 0, skippedTests 0"
              return 1
            fi
          }
          # The files still to run.
          set -- integration_test/m11_ios_test.dart
          failed=""
          # shellcheck disable=SC2043 # one file for now (see above).
          for f in integration_test/m11_ios_test.dart; do
            name=$(basename "$f" .dart)
            echo "::group::$f"
            set +e
            # shellcheck disable=SC2016 # $1 is the child bash's argument.
            run_with_timeout 420 bash -c 'test_file "$1"' _ "$name" 2>&1 | tee "$LOGS/$name.log"
            rc=${PIPESTATUS[0]}
            set -e
            if [ "$rc" -ne 124 ] && ! check_summary "$name" && [ "$rc" -eq 0 ]; then
              rc=1
            fi
            echo "::endgroup::"
            shift
            if [ "$rc" -eq 124 ]; then
              echo "::error::$f: no result within 420 s; stopped. Not run: ${*:-none}"
              xcrun simctl terminate "$UDID" ro.horiasav.rustlineFlutterExample 2>/dev/null || true
              exit 1
            fi
            if [ "$rc" -ne 0 ]; then
              echo "::error::$f failed (exit $rc)"
              failed="$failed $f"
              xcrun simctl terminate "$UDID" ro.horiasav.rustlineFlutterExample 2>/dev/null || true
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::integration test files that failed:$failed"
            exit 1
          fi
      # Crash reports of the app, if it died at launch.
      - name: Collect crash reports
        if: always()
        run: cp ~/Library/Logs/DiagnosticReports/Runner* "$LOGS"/ 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: ios-sim-logs
          path: ${{ env.LOGS }}
          if-no-files-found: ignore

  device:
    name: flutter build ios --no-codesign (example and blank app)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          key: ios-device
          cache-targets: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2  # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build the example
        working-directory: rustline_flutter/example
        run: |
          flutter pub get --enforce-lockfile
          flutter build ios --release --no-codesign
      # Baseline: a blank app from the same Flutter, built the same way.
      - name: Build a blank app
        run: |
          flutter create --platforms=ios --project-name blank "$RUNNER_TEMP/blank"
          cd "$RUNNER_TEMP/blank"
          flutter build ios --release --no-codesign
      - name: Size summary
        working-directory: rustline_flutter/example
        run: |
          # Where the podspec's script phase puts it (OTHER_LDFLAGS -force_load).
          lib=$(find build/ios -path "*/rustline_flutter/librustline_ffi.a" | head -n 1)
          app=build/ios/iphoneos/Runner.app
          fw="$app/Frameworks/rustline_flutter.framework"
          blank="$RUNNER_TEMP/blank/build/ios/iphoneos/Runner.app"
          if [ -z "$lib" ]; then
            echo "::error::librustline_ffi.a not found under rustline_flutter/example/build/ios"
            exit 1
          fi
          for p in "$fw" "$app" "$blank"; do
            if [ ! -e "$p" ]; then
              echo "::error::$p not found (did the build step produce it?)"
              exit 1
            fi
          done
          bytes() { find "$1" -type f -exec stat -f %z {} + | awk '{ s += $1 } END { print s + 0 }'; }
          {
            echo "| Item | Bytes |"
            echo "|---|---|"
            echo "| librustline_ffi.a (static, before linking) | $(bytes "$lib") |"
            echo "| rustline_flutter.framework | $(bytes "$fw") |"
            echo "| Runner.app (example) | $(bytes "$app") |"
            echo "| Runner.app (blank app) | $(bytes "$blank") |"
          } > ios-size.md
          cat ios-size.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ios-size
          path: rustline_flutter/example/ios-size.md

  ffi:
    name: cargo test rustline-ffi (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          key: ios-ffi
      - name: Test
        run: cargo test --locked -p rustline-ffi
