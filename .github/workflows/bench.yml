name: Bench

# Manual only (plan M5 step 8): timings on shared runners are noisy, so the
# numbers in spec §12 come from a local run; this job is for spot checks.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bench:
    name: cargo bench (plan)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: Fetch fixtures
        run: scripts/fetch-fixtures.sh --skip-manual
      - name: Bench
        run: cargo bench --locked -p rustline-core --bench plan
