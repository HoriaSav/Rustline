name: Real feeds

# Plan M10 step 6 (decision 3): the required CI has no feeds (gitignored), so
# real-feed tests skip there. This workflow fetches every fixture that has a
# public URL with scripts/fetch-fixtures.sh, which checks the pinned sha256
# from fixtures/manifest.tsv before any test reads a file, caches them by the
# manifest hash, and runs the workspace tests with the feeds present.
# Manual and weekly: upstream "latest" URLs change, and a changed feed must
# fail here (CHANGED) instead of breaking PRs.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: real-feeds-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  real-feeds:
    name: tests with real feeds
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          key: real-feeds
      - name: Cache fixtures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: fixtures/feeds
          key: fixtures-${{ hashFiles('fixtures/manifest.tsv') }}
      # Downloads what is missing, then verifies the sha256 of every file
      # (cached ones included). Rows without a public URL are reported as
      # SKIP; their tests skip.
      - name: Fetch and verify fixtures
        run: scripts/fetch-fixtures.sh --skip-manual
      # m9_perf runs in its own single-threaded step below.
      - name: Test (release)
        run: cargo test --locked --workspace --release -- --skip m9::budget_ --skip m9::worst_case_mbta
      # Shared runners vary in speed (README Known gap 37): the M9 speed
      # budgets print WARN (as annotations) and fail only above 3× the limit;
      # the 2 s worst case and 20-result cap always apply.
      - name: M9 perf report
        env:
          RUSTLINE_M9_REPORT_ONLY: "1"
        run: |
          # Keep the exit code so the summary and annotations are written
          # even when the test fails.
          rc=0
          cargo test --locked --release -p rustline-core --test m9_perf -- --nocapture --test-threads=1 2>&1 | tee m9_perf.log || rc=$?
          {
            echo '### M9 perf'
            echo '```'
            grep -E 'p95|worst case|WARN:' m9_perf.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -o 'WARN: .*' m9_perf.log | sed 's/^WARN: /::warning title=M9 budget::/' || true
          exit "$rc"
