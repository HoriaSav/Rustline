[package]
name = "rustline-pack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rustline-model = { path = "../rustline-model" }
# Zero-copy serialization for the pack body (decision in spec §7.5).
# 0.8 needs Rust 1.81, below our MSRV 1.85.
rkyv = "0.8"
# Dates in PackMeta. Already used by rustline-gtfs; 0.4 builds with Rust 1.61+.
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
thiserror = "2.0.21"
# CRC32 of header + body, checked on read. Already in the tree (via zip); 1.5 needs Rust 1.63.
crc32fast = "1.5"
# zstd compression for transport (.rlp.zst). 0.13 builds with Rust 1.64+.
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
# Only for the round-trip tests: builds a real timetable from a GTFS feed.
rustline-gtfs = { path = "../rustline-gtfs" }
# sha256 of two builds in the reproducibility test (already in the tree).
sha2 = "0.10"
