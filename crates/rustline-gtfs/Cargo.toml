[package]
name = "rustline-gtfs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
# Exact version: 0.x bumps change the API, so a bump is reviewed on its own
# (Dependabot opens a separate PR for it).
gtfs-structures = { version = "=0.52.0", default-features = false }
rustline-model = { path = "../rustline-model" }
rustline-pack = { path = "../rustline-pack" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
# Own tolerant transfers.txt reader (M5): the same csv and zip versions and
# features gtfs-structures already uses, so no new crates.
csv = "1.4"
# Own trips/stop_times reader (M7): csv's own low-level parser (already in the
# tree through csv), used for its fixed-size buffers so a row can't grow memory.
csv-core = "0.1.13"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# IANA timezone names: agency_timezone is checked at build time (M1 gap #4).
chrono-tz = "0.10"
