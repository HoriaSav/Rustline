[package]
name = "rustline-gtfs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
# Pinned: 0.50 pulls zip 8.6, which needs Rust 1.88 (our MSRV is 1.85).
gtfs-structures = { version = "=0.48.0", default-features = false }
rustline-model = { path = "../rustline-model" }
rustline-pack = { path = "../rustline-pack" }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
# Own tolerant transfers.txt reader (M5): the same csv and zip versions and
# features gtfs-structures already uses, so no new crates.
csv = "1.4"
zip = { version = "7.2", default-features = false, features = ["deflate"] }
# IANA timezone names: agency_timezone is checked at build time (M1 gap #4).
chrono-tz = "0.10"
